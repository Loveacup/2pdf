name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare browser and CJK fonts
        run: |
          npm install --prefix "$HOME" playwright
          echo "NODE_PATH=$HOME/node_modules" >> "$GITHUB_ENV"
          "$HOME/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Initialize and render the setup smoke document
        run: python scripts/maintenance.py init
      - name: Install tests in the isolated environment
        run: |
          "$HOME/.venvs/pdf-skill/bin/python" -m pip install pytest
      - name: Offline regression suite
        run: |
          "$HOME/.venvs/pdf-skill/bin/python" -m pytest -c tests/pytest.ini tests -m 'not integration' -q
      - name: Render and verify actual PDF output
        run: |
          "$HOME/.venvs/pdf-skill/bin/python" scripts/md2pdf_chrome.py tests/fixtures/sample.md "$RUNNER_TEMP/sample.pdf" --browser playwright --verify
          "$HOME/.venvs/pdf-skill/bin/python" scripts/verify_pdf.py "$RUNNER_TEMP/sample.pdf" --src tests/fixtures/sample.md --json --fail-on error
